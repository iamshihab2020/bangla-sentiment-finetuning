# E1: full fine-tuning of BanglaBERT (PRD section 8). The learning rate is chosen on validation
# at 1k examples, seed 0, and then frozen for every other E1, E4, E5 and E6 run.
experiment: E1
dataset: sentnob
model: csebuetnlp/banglabert
max_seq_len: 128
train_batch_size: 32      # effective batch 32, fits in 6 GB (results/m0_encoder_check.json)
eval_batch_size: 128
max_epochs: 5
min_steps: 150            # small subsets train longer, so every size gets a fair number of updates
learning_rates: [2.0e-5, 3.0e-5, 5.0e-5]
weight_decay: 0.01        # not applied to bias and LayerNorm, the standard BERT recipe
warmup_ratio: 0.1
max_grad_norm: 1.0
precision: bf16 autocast
