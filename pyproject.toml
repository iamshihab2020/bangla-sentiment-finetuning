[project]
name = "bangla-sentiment-finetuning"
version = "0.1.0"
description = "Data efficiency of QLoRA fine-tuned small LLMs vs BanglaBERT for noisy Bangla sentiment classification on a 6 GB laptop GPU."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sheikh Shihab Hossain" }]
requires-python = ">=3.12,<3.13"
# Exact versions verified working on the M0 machine (RTX 3050 laptop, Windows 11), 2026-09-19.
dependencies = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "peft==0.21.0",
    "trl==1.13.0",
    "bitsandbytes==0.50.2",
    "datasets==5.0.1",
    "evaluate==0.4.6",
    "huggingface-hub==1.32.0",
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
    "sentencepiece==0.2.2",
    "protobuf==7.36.2",
    "nvidia-ml-py==13.610.43",
    "tqdm==4.70.1",
    # Text normalizer required by BanglaBERT, pinned to a commit
    "normalizer @ git+https://github.com/csebuetnlp/normalizer@d405944dde5ceeacb7c2fd3245ae2a9dea5f35c9",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bangla_sentiment"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# PyTorch with CUDA 13.0 comes from the PyTorch index, everything else from PyPI
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
